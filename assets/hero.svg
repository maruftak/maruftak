<svg width="900" height="460" viewBox="0 0 900 460" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF2E63"/>
    </linearGradient>
    <radialGradient id="radar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="20" y="20" width="860" height="420" rx="14"/></clipPath>
    <style>
      .ln { opacity: 0; }
      .prompt { fill: #39FF14; }
      .cmd { fill: #C9D1D9; }
      .out { fill: #00E5FF; }
      .warn { fill: #FF2E63; }
      .dim { fill: #6E7681; }
      @keyframes reveal { to { opacity: 1; } }
      .r1{animation:reveal .01s .4s forwards} .r2{animation:reveal .01s 1.1s forwards}
      .r3{animation:reveal .01s 1.9s forwards} .r4{animation:reveal .01s 2.7s forwards}
      .r5{animation:reveal .01s 3.6s forwards} .r6{animation:reveal .01s 4.5s forwards}
      .r7{animation:reveal .01s 5.4s forwards} .r8{animation:reveal .01s 6.3s forwards}
      .r9{animation:reveal .01s 7.2s forwards}
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: blink 1s step-end infinite; fill:#39FF14; }
      @keyframes sweep { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      .sweep { transform-origin: 762px 232px; animation: sweep 3.5s linear infinite; }
      @keyframes ping { 0%{r:6;opacity:.9} 100%{r:70;opacity:0} }
      .ping { animation: ping 3s ease-out infinite; }
      .ping2 { animation: ping 3s ease-out 1.5s infinite; }
      @keyframes scanline { 0%{transform:translateY(0)} 100%{transform:translateY(420px)} }
      .scan { animation: scanline 6s linear infinite; }
      @keyframes bar { 0%{width:0} 100%{width:150px} }
      .barfill { animation: bar 7s ease-out forwards; }
    </style>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="860" height="420" rx="14" fill="url(#bg)" stroke="#1f2630" stroke-width="1.5"/>
  <rect x="20" y="20" width="860" height="420" rx="14" fill="none" stroke="url(#neon)" stroke-width="1.5" opacity="0.4"/>

  <!-- moving scanline -->
  <g clip-path="url(#screen)">
    <rect class="scan" x="20" y="20" width="860" height="2" fill="#00E5FF" opacity="0.06"/>
  </g>

  <!-- title bar -->
  <g>
    <circle cx="46" cy="44" r="6" fill="#FF5F56"/>
    <circle cx="68" cy="44" r="6" fill="#FFBD2E"/>
    <circle cx="90" cy="44" r="6" fill="#27C93F"/>
    <text x="450" y="48" text-anchor="middle" font-size="12.5" class="dim">maruf@security: ~/operations — zsh — 900×460</text>
  </g>
  <line x1="20" y1="64" x2="880" y2="64" stroke="#1f2630" stroke-width="1"/>

  <!-- terminal text -->
  <g font-size="14.5">
    <text x="44" y="98"  class="ln r1"><tspan class="prompt">┌──(</tspan><tspan class="out">maruf㉿security</tspan><tspan class="prompt">)-[</tspan><tspan class="cmd">~</tspan><tspan class="prompt">]</tspan></text>
    <text x="44" y="120" class="ln r1"><tspan class="prompt">└─$</tspan> <tspan class="cmd">whoami --role</tspan></text>
    <text x="64" y="144" class="ln r2 out" filter="url(#glow)">➜ Penetration Tester · Ethical Hacker · SOC Analyst</text>

    <text x="44" y="180" class="ln r3"><tspan class="prompt">└─$</tspan> <tspan class="cmd">nmap -sV --script vuln target.scope</tspan></text>
    <text x="64" y="204" class="ln r4 dim">Starting scan · enumerating attack surface ...</text>
    <text x="64" y="226" class="ln r5"><tspan class="out">[+]</tspan> <tspan class="cmd">443/tcp  https   </tspan><tspan class="dim">→ TLS1.3 · headers hardened</tspan></text>
    <text x="64" y="248" class="ln r6"><tspan class="warn">[!]</tspan> <tspan class="cmd">8080/tcp http    </tspan><tspan class="warn">→ IDOR + reflected XSS found</tspan></text>

    <text x="44" y="284" class="ln r7"><tspan class="prompt">└─$</tspan> <tspan class="cmd">soc --watch --siem splunk</tspan></text>
    <text x="64" y="308" class="ln r8"><tspan class="out">[MITRE]</tspan> <tspan class="cmd">mapping TTPs · alert triaged · IR ready</tspan></text>

    <text x="44" y="344" class="ln r9"><tspan class="prompt">└─$</tspan> <tspan class="cmd">echo "break it · understand it · secure it"</tspan></text>
    <text x="44" y="372" class="ln r9"><tspan class="prompt">└─$</tspan> <tspan class="cursor">█</tspan></text>
  </g>

  <!-- threat-scan radar -->
  <g transform="translate(0,0)">
    <circle cx="762" cy="232" r="74" fill="none" stroke="#1f2630"/>
    <circle cx="762" cy="232" r="50" fill="none" stroke="#1f2630"/>
    <circle cx="762" cy="232" r="26" fill="none" stroke="#1f2630"/>
    <line x1="688" y1="232" x2="836" y2="232" stroke="#1f2630"/>
    <line x1="762" y1="158" x2="762" y2="306" stroke="#1f2630"/>
    <circle class="ping"  cx="762" cy="232" fill="none" stroke="#39FF14" stroke-width="1.5"/>
    <circle class="ping2" cx="762" cy="232" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
    <g class="sweep">
      <path d="M762 232 L762 158 A74 74 0 0 1 826 196 Z" fill="url(#radar)"/>
    </g>
    <circle cx="800" cy="206" r="3" fill="#FF2E63" filter="url(#glow)"/>
    <circle cx="738" cy="262" r="3" fill="#39FF14" filter="url(#glow)"/>
    <text x="762" y="334" text-anchor="middle" font-size="11" class="dim">THREAT SCAN · LIVE</text>
  </g>

  <!-- status footer -->
  <line x1="20" y1="404" x2="880" y2="404" stroke="#1f2630" stroke-width="1"/>
  <g font-size="11.5">
    <circle cx="46" cy="424" r="4" fill="#27C93F"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="58" y="428" class="dim">STATUS</text><text x="106" y="428" class="out">OPERATIONAL</text>
    <text x="230" y="428" class="dim">RECON</text>
    <rect x="276" y="420" width="150" height="6" rx="3" fill="#161b22"/>
    <rect class="barfill" x="276" y="420" height="6" rx="3" fill="url(#neon)"/>
    <text x="700" y="428" class="dim">> always learning · always hunting</text>
  </g>
</svg>
